name: openhie-project
description: null
collections: null
channels:
  Second-Channel:
    name: Second Channel
    destination_url: 'https://example.com/second-v2'
    enabled: true
    destination_credential: null
  test-channel:
    name: test-channel
    destination_url: 'https://example.com/hook3'
    enabled: true
    destination_credential: null
credentials: null
workflows:
  OpenHIE-Workflow:
    name: OpenHIE Workflow
    jobs:
      Transform-data-to-FHIR-standard1:
        name: Transform data to FHIR standard1
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          fn(state => state);

      Send-to-OpenHIM-to-route-to-SHR:
        name: Send to OpenHIM to route to SHR
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          fn(state => state);

      Notify-CHW-upload-successful:
        name: Notify CHW upload successful
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          fn(state => state);

      Notify-CHW-upload-failed:
        name: Notify CHW upload failed
        adaptor: '@openfn/language-http@latest'
        credential: null
        body: |
          fn(state => state);

    triggers:
      webhook:
        type: webhook
        webhook_reply: before_start
        enabled: false
    edges:
      webhook->Transform-data-to-FHIR-standard1:
        source_trigger: webhook
        target_job: Transform-data-to-FHIR-standard1
        condition_type: always
        enabled: true
      Transform-data-to-FHIR-standard1->Send-to-OpenHIM-to-route-to-SHR:
        source_job: Transform-data-to-FHIR-standard1
        target_job: Send-to-OpenHIM-to-route-to-SHR
        condition_type: on_job_success
        enabled: true
      Send-to-OpenHIM-to-route-to-SHR->Notify-CHW-upload-successful:
        source_job: Send-to-OpenHIM-to-route-to-SHR
        target_job: Notify-CHW-upload-successful
        condition_type: on_job_success
        enabled: true
      Send-to-OpenHIM-to-route-to-SHR->Notify-CHW-upload-failed:
        source_job: Send-to-OpenHIM-to-route-to-SHR
        target_job: Notify-CHW-upload-failed
        condition_type: on_job_failure
        enabled: true
