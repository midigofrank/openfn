id: event-based-workflow
name: Event-based workflow
start: webhook
steps:
  - id: http
    name: Http
    adaptor: '@openfn/language-http@7.3.1'
    expression: ./http.js
  - id: transform-data
    name: Transform data
    adaptor: '@openfn/language-common@latest'
    expression: ./transform-data.js
    next:
      http:
        disabled: false
        condition: on_job_success
  - id: webhook
    type: webhook
    webhook_reply: after_completion
    webhook_response_config: {}
    next:
      transform-data:
        disabled: false
        condition: always
