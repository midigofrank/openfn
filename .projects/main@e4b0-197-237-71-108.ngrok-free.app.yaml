  - name: Fetch Google Sheet Data
    steps:
      - id: cron
        type: cron
        cron_expression: '*/1 * * * *'
        openfn:
          enabled: false
          uuid: ada660d4-d620-47dc-9630-b2a18d95b474
        next:
          get-data:
            disabled: false
            condition: always
            openfn:
              uuid: 1ab6899b-a3fe-4fd3-9070-2ba45c57ffe5
      - id: get-data
        name: Get data
        expression: >
          // Read data from the Google Sheet

          getValues('17xd3lmxlup-bxVS-U6agvD6L7UQm6DzEsU43Iw2Fas4',
          'Sheet1!A:Z');


          // Convert the rows into JSON objects (first row = headers)

          fn(state => {
            const [headers, ...rows] = state.data.values;
            const json = rows.map(row => {
              return headers.reduce((obj, key, i) => {
                obj[key] = row[i];
                return obj;
              }, {});
            });

            return { ...state, data: json };
          });
        adaptor: '@openfn/language-googlesheets@5.1.1'
        openfn:
          uuid: 57c7b7df-4869-41d8-971a-9fcf4ef95e7c
    history:
      - cli:abaa91539a0a
    openfn:
      uuid: 65088d55-259d-4011-a51f-293b2ddf18aa
      inserted_at: 2026-10-06T08:05:11Z
      updated_at: 2026-10-06T08:05:11Z
      lock_version: 1
    id: fetch-google-sheet-data
    start: cron
  - name: Sample Workflow
    steps:
      - id: job-1-check-if-age-is-over-18-months
        name: Job 1 - Check if age is over 18 months
        expression: |2
            fn(state => {
              console.log(state);
              
              if (state.data.age_in_months > 18) {
                console.log('Eligible for program.');
                return state;
              }
              else { throw 'Error, patient ineligible.' }
            });
        adaptor: '@openfn/language-common@latest'
        openfn:
          uuid: 6f5c93ea-0465-485a-95a8-0e9e8b53697b
        next:
          job-2-convert-data-to-dhis2-format:
            disabled: false
            condition: on_job_success
            openfn:
              uuid: d8c57118-e66b-4e4d-b746-d5418f781544
      - id: job-2-convert-data-to-dhis2-format
        name: Job 2 - Convert data to DHIS2 format
        expression: |2
            fn(state => {
              const names = state.data.name.split(' ');
              return { ...state, names };
            });
        adaptor: '@openfn/language-common@latest'
        openfn:
          uuid: 237c99c5-781d-40bc-abe4-48a0fbad4210
        next:
          job-3-upload-to-dhis2:
            disabled: false
            condition: on_job_success
            openfn:
              uuid: 6b9871cf-4974-4200-a760-2fb60df40a04
      - id: job-3-upload-to-dhis2
        name: Job 3 - Upload to DHIS2
        expression: |2
            create('trackedEntityInstances', {
              trackedEntityType: 'nEenWmSyUEp', // a person
              orgUnit: 'DiszpKrYNg8',
              attributes: [
                {
                  attribute: 'w75KJ2mc4zz', // attribute id for first name
                  value: state.names[0] // the first name from submission
                },
                {
                  attribute: 'zDhUuAYrxNC', // attribute id for last name
                  value: state.names[1] // the last name from submission
                }
              ]
            });
        adaptor: '@openfn/language-dhis2@latest'
        openfn:
          uuid: 9b34858e-6839-4779-8aac-f7d1f1275eaf
      - id: webhook
        type: webhook
        webhook_reply: after_completion
        webhook_response_config: {}
        openfn:
          enabled: false
          uuid: a89f6524-8baa-4faf-867e-e1e624f9db68
        next:
          job-1-check-if-age-is-over-18-months:
            disabled: false
            condition: always
            openfn:
              uuid: c1e163f9-b41d-43ff-820a-81f2e82f5cc5
