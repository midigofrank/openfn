      - id: generate-cat-poem
        name: generate-cat-poem
        expression: >-
          prompt('Write a short, fun poem about cats.', { model:
          'gemini-3.6-flash' });


          fn(state => {
            console.log('prompt response:', JSON.stringify(state.data, null, 2));
            return { ...state, catPoem: { text: state.data.response } };
          });
        adaptor: '@openfn/language-gemini@1.0.8'
        openfn:
          uuid: 86f2b9b8-7b15-4200-84cc-bf5715e782e6
