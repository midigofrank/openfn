      - id: notify-chw-upload-failed
        name: Notify CHW upload failed
        expression: |
          fn(state => state);
        adaptor: '@openfn/language-http@latest'
        openfn:
          uuid: fa62d642-bfc7-4f3a-b7c2-d54c6dba7e95
      - id: notify-chw-upload-successful
        name: Notify CHW upload successful
        expression: |
          fn(state => state);
        adaptor: '@openfn/language-http@latest'
        openfn:
          uuid: 732523ce-4f00-4352-a248-ee3519b0eede
      - id: send-to-openhim-to-route-to-shr
        name: Send to OpenHIM to route to SHR
        expression: |
          fn(state => state);
        adaptor: '@openfn/language-http@latest'
        openfn:
          uuid: 11b54c45-e126-409b-a126-b1f49d6fb7f5
        next:
          notify-chw-upload-successful:
            disabled: false
            condition: on_job_success
            openfn:
              uuid: c7bb0c5b-c7cf-4910-ae76-b75d448c672d
          notify-chw-upload-failed:
            disabled: false
            condition: on_job_failure
            openfn:
              uuid: 81fd35c6-c335-4031-80ec-c67e7434ea18
      - id: transform-data-to-fhir-standard1
        name: Transform data to FHIR standard1
        expression: |
          fn(state => state);
        adaptor: '@openfn/language-http@latest'
        openfn:
          uuid: 381daed4-a1ae-45a3-88c4-b27485b2d3de
        next:
          send-to-openhim-to-route-to-shr:
            disabled: false
            condition: on_job_success
            openfn:
              uuid: feaadc99-b7f6-4c86-9a24-9f33e40fb302
      - id: webhook
        type: webhook
        enabled: false
        webhook_reply: before_start
        openfn:
          uuid: cae544ab-03dc-4ccc-a09c-fb4edb255d7a
        next:
          transform-data-to-fhir-standard1:
            disabled: false
            condition: always
            openfn:
              uuid: eb696f4d-6567-42a8-bb0f-166e3eae4f0b
