on:
  push:
    branches:
      - main
    # Only deploy when this project's workspace (or this file) changes
    paths:
      - 'alias-test/**'
      - '.github/workflows/openfn-4adf2644-ed4e-4f97-a24c-ab35b3cb1efa-deploy.yml'
  workflow_dispatch:
    inputs:
      force:
        description:
          'Deploy even if the project has changed in OpenFn since the last sync'
        type: boolean
        default: false

# Shared with openfn-pull.yml so a pull and a deploy never push to the same
# branch at once
concurrency:
  group: openfn-main
  cancel-in-progress: false

jobs:
  deploy-to-lightning:
    runs-on: ubuntu-latest
    name: A job to deploy to Lightning
    permissions:
      contents: write
    steps:
      - name: openfn deploy
        uses: midigofrank/cli-deploy-action@v2
        with:
          secret_input: ${{ secrets.OPENFN_4adf2644_ed4e_4f97_a24c_ab35b3cb1efa_API_KEY }}
          project_id_input: '4adf2644-ed4e-4f97-a24c-ab35b3cb1efa'
          endpoint_input: 'https://e4b0-197-237-71-108.ngrok-free.app'
          workspace_input: 'alias-test'
          # A commit with [openfn force] in its message forces the deploy too
          force_input: ${{ inputs.force || contains(github.event.head_commit.message, '[openfn force]') }}
