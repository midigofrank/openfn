id: scheduled-workflow
name: Scheduled workflow
start: cron
steps:
  - id: cron
    type: cron
    cron_expression: 0/1 0 * * *
    cron_cursor_job_id: get-data
    next:
      get-data:
        disabled: false
        condition: always
  - id: get-data
    name: Get data
    adaptor: '@openfn/language-http@latest'
    expression: ./get-data.js
